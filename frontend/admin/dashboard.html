<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Street Animal Rescue</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Portal</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" class="active">Dashboard</a></li>
                    <li><a href="reports.html">Manage Reports</a></li>
                    <li><a href="users.html">Manage Users</a></li>
                    <li><a href="rescuers.html">Manage Rescuers</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="btn btn-block btn-outline" style="border-color: rgba(255,255,255,0.3); color: white;">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle">☰</div>
                <div class="user-info">
                    <span id="user-name">Admin</span>
                    <span class="badge bg-primary">Admin</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-title">
                    <h1>Admin Dashboard</h1>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon bg-primary">👥</div>
                        <div class="stat-info">
                            <h3 id="total-users">0</h3>
                            <p>Total Users</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-secondary">👷</div>
                        <div class="stat-info">
                            <h3 id="total-rescuers">0</h3>
                            <p>Total Rescuers</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-warning">📋</div>
                        <div class="stat-info">
                            <h3 id="total-reports">0</h3>
                            <p>Total Reports</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-success">✅</div>
                        <div class="stat-info">
                            <h3 id="completed-rescues">0</h3>
                            <p>Completed Rescues</p>
                        </div>
                    </div>
                </div>

                <div class="data-card mt-2">
                    <h2>Quick Actions</h2>
                    <div style="display: flex; gap: 15px; margin-top: 15px;">
                        <a href="reports.html" class="btn btn-primary">Review Pending Reports</a>
                        <a href="rescuers.html" class="btn btn-secondary">Assign Rescuers</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkAuth('admin');
            if (user) {
                document.getElementById('user-name').textContent = user.name;
                
                try {
                    const response = await apiGet('/admin/dashboard');
                    const stats = response.data;
                    
                    document.getElementById('total-users').textContent = stats.totalUsers;
                    document.getElementById('total-rescuers').textContent = stats.totalRescuers;
                    document.getElementById('total-reports').textContent = stats.totalReports;
                    document.getElementById('completed-rescues').textContent = stats.completedRescues;
                } catch (error) {
                    console.error('Error fetching admin stats', error);
                }
            }

            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.querySelector('.sidebar').classList.toggle('active');
            });
        });
    </script>
</body>
</html>
