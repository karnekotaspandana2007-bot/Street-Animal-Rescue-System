<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Smart Street Animal Rescue</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Portal</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="reports.html">Manage Reports</a></li>
                    <li><a href="users.html" class="active">Manage Users</a></li>
                    <li><a href="rescuers.html">Manage Rescuers</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="btn btn-block btn-outline" style="border-color: rgba(255,255,255,0.3); color: white;">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle">☰</div>
                <div class="user-info">
                    <span id="user-name">Admin</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-title">
                    <h1>Registered Users</h1>
                </div>

                <div class="data-card">
                    <div style="overflow-x: auto;">
                        <table id="users-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Location</th>
                                    <th>Registration Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="5">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkAuth('admin');
            
            if (user) {
                document.getElementById('user-name').textContent = user.name;
                
                try {
                    const response = await apiGet('/admin/users');
                    const usersList = response.data;
                    const tbody = document.querySelector('#users-table tbody');
                    tbody.innerHTML = '';
                    
                    if (usersList.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No users found</td></tr>';
                    } else {
                        usersList.forEach(u => {
                            const date = new Date(u.createdAt).toLocaleDateString();
                            tbody.innerHTML += `
                                <tr>
                                    <td><strong>${u.name}</strong></td>
                                    <td>${u.email}</td>
                                    <td>${u.phone}</td>
                                    <td>${u.location || 'N/A'}</td>
                                    <td>${date}</td>
                                </tr>
                            `;
                        });
                    }
                } catch (error) {
                    console.error('Error fetching users', error);
                    document.querySelector('#users-table tbody').innerHTML = `<tr><td colspan="5" class="text-center text-danger">${error.message}</td></tr>`;
                }
            }

            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.querySelector('.sidebar').classList.toggle('active');
            });
        });
    </script>
</body>
</html>
