<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Street Animal Rescue</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    
    <div class="auth-container">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Login to report or rescue animals</p>
        </div>
        
        <div id="error-message" class="alert alert-danger hidden"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block mt-2">LOGIN</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
            <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; font-size: 13px; color: #555; text-align: left;">
                <strong>Demo Accounts (Click to auto-fill):</strong><br>
                • Admin: <a href="javascript:void(0)" onclick="fillCreds('admin@gmail.com','adminpassword123')" style="text-decoration: underline; font-weight: 600;"><code>admin@gmail.com</code></a> / <code>adminpassword123</code><br>
                • Rescuer: <a href="javascript:void(0)" onclick="fillCreds('rescuer@gmail.com','rescuerpassword123')" style="text-decoration: underline; font-weight: 600;"><code>rescuer@gmail.com</code></a> / <code>rescuerpassword123</code>
            </div>
            <p style="margin-top: 10px;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>

    <script>
        function fillCreds(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }
    </script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
