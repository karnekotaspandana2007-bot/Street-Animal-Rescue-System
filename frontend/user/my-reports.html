<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports - Smart Street Animal Rescue</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Smart Rescue</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="report-animal.html">Report Animal</a></li>
                    <li><a href="my-reports.html" class="active">My Reports</a></li>
                    <li><a href="nearby-centers.html">Nearby Centers</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="btn btn-block btn-outline" style="border-color: rgba(255,255,255,0.3); color: white;">Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle">☰</div>
                <div class="user-info">
                    <span id="user-name">Welcome</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-title">
                    <h1>My Animal Reports</h1>
                </div>

                <div class="report-grid" id="reports-container">
                    <p>Loading reports...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkAuth('user');
            if (user) {
                document.getElementById('user-name').textContent = `Welcome, ${user.name}`;
                
                try {
                    const response = await apiGet('/reports/my');
                    const reports = response.data;
                    const container = document.getElementById('reports-container');
                    
                    container.innerHTML = '';
                    
                    if (reports.length === 0) {
                        container.innerHTML = '<p>You have not made any reports yet. <a href="report-animal.html">Report an animal now</a>.</p>';
                    } else {
                        reports.forEach(report => {
                            let badgeClass = 'badge-pending';
                            if (report.status === 'Verified') badgeClass = 'badge-verified';
                            if (report.status === 'Assigned') badgeClass = 'badge-assigned';
                            if (report.status === 'Rescue In Progress') badgeClass = 'badge-progress';
                            if (report.status === 'Completed' || report.status === 'Rescued') badgeClass = 'badge-completed';
                            
                            const date = new Date(report.createdAt).toLocaleDateString();
                            
                            container.innerHTML += `
                                <div class="report-card">
                                    <img src="http://localhost:5000${report.image}" alt="${report.animalType}" class="report-img" onerror="this.src='../assets/images/placeholder.jpg'">
                                    <div class="report-details">
                                        <div class="report-header">
                                            <h3>${report.animalType}</h3>
                                            <span class="badge ${badgeClass}">${report.status}</span>
                                        </div>
                                        <div class="report-info">
                                            <strong>Condition:</strong> ${report.condition} (${report.severity}) <br>
                                            <strong>Location:</strong> ${report.address} <br>
                                            <strong>Date:</strong> ${date}
                                        </div>
                                        <p style="margin-bottom: 15px; font-size: 14px; color: #666;">${report.description}</p>
                                    </div>
                                </div>
                            `;
                        });
                    }
                } catch (error) {
                    console.error('Error fetching reports', error);
                    document.getElementById('reports-container').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                }
            }

            // Mobile menu toggle
            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.querySelector('.sidebar').classList.toggle('active');
            });
        });
    </script>
</body>
</html>
