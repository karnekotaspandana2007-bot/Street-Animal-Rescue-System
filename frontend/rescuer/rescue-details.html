<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Details - Smart Street Animal Rescue</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .report-full-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Rescuer Portal</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="assigned-reports.html">Assigned Reports</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle">☰</div>
                <div class="user-info">
                    <span id="user-name">Welcome</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-title">
                    <h1>Rescue Mission Details</h1>
                    <a href="assigned-reports.html" class="btn btn-secondary">← Back</a>
                </div>

                <div id="alert-msg" class="alert hidden"></div>

                <div class="data-card" id="report-content">
                    <p>Loading details...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Completion Modal -->
    <div id="completeModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:30px; border-radius:8px; width:100%; max-width:500px;">
            <h2>Complete Rescue</h2>
            <form id="complete-form">
                <div class="form-group mt-2">
                    <label>Rescue Notes</label>
                    <textarea id="rescue-notes" class="form-control" required placeholder="How did the rescue go? Where is the animal now?"></textarea>
                </div>
                <div class="form-group">
                    <label>Completion Photo (Optional)</label>
                    <input type="file" id="completion-image" class="form-control" accept="image/*">
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" id="btn-submit-complete" class="btn btn-success btn-block">SUBMIT COMPLETION</button>
                    <button type="button" onclick="document.getElementById('completeModal').style.display='none'" class="btn btn-secondary btn-block">CANCEL</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkAuth('rescuer');
            if (user) {
                document.getElementById('user-name').textContent = `Welcome, ${user.name}`;
                
                const urlParams = new URLSearchParams(window.location.search);
                const reportId = urlParams.get('id');
                
                if (!reportId) {
                    document.getElementById('report-content').innerHTML = '<p class="alert alert-danger">No report ID provided.</p>';
                    return;
                }

                const loadReport = async () => {
                    try {
                        const response = await apiGet(`/rescuer/reports/${reportId}`);
                        const report = response.data;
                        
                        let actionButtons = '';
                        if (report.status === 'Assigned') {
                            actionButtons = `<button onclick="updateStatus('Rescue In Progress')" class="btn btn-primary">START RESCUE</button>`;
                        } else if (report.status === 'Rescue In Progress') {
                            actionButtons = `
                                <button onclick="updateStatus('Rescued')" class="btn btn-secondary">MARK AS RESCUED</button>
                                <button onclick="openCompleteModal()" class="btn btn-success" style="margin-left: 10px;">COMPLETE RESCUE</button>
                            `;
                        } else if (report.status === 'Rescued') {
                            actionButtons = `<button onclick="openCompleteModal()" class="btn btn-success">COMPLETE RESCUE</button>`;
                        } else {
                            actionButtons = `<span class="alert alert-success">This rescue is completed.</span>`;
                        }

                        const mapUrl = `https://www.openstreetmap.org/?mlat=${report.latitude}&mlon=${report.longitude}#map=15/${report.latitude}/${report.longitude}`;

                        document.getElementById('report-content').innerHTML = `
                            <div class="details-grid">
                                <div>
                                    <img src="${getImageUrl(report.image)}" class="report-full-img" alt="Animal" onerror="this.src='../assets/images/placeholder.jpg'">
                                    <div style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 8px;">
                                        <h3>Update Status</h3>
                                        <div style="margin-top: 15px;">
                                            ${actionButtons}
                                        </div>
                                    </div>
                                </div>
                                
                                <div>
                                    <h2>${report.animalType}</h2>
                                    <p class="badge badge-assigned mt-1 mb-2" style="display:inline-block">${report.status}</p>
                                    
                                    <table style="margin-bottom: 20px;">
                                        <tr><th>Condition</th><td>${report.condition}</td></tr>
                                        <tr><th>Severity</th><td>${report.severity}</td></tr>
                                        <tr><th>Reporter</th><td>${report.userId.name} (${report.userId.phone})</td></tr>
                                        <tr><th>Location</th><td>${report.address}</td></tr>
                                    </table>
                                    
                                    <a href="${mapUrl}" target="_blank" class="btn btn-outline mb-2">View on Map</a>
                                    
                                    <h3>Description</h3>
                                    <p style="background: #f1f2f6; padding: 15px; border-radius: 4px; margin-top: 10px;">${report.description}</p>
                                </div>
                            </div>
                        `;
                    } catch (error) {
                        document.getElementById('report-content').innerHTML = `<p class="alert alert-danger">${error.message}</p>`;
                    }
                };

                await loadReport();

                window.updateStatus = async (newStatus) => {
                    try {
                        await apiPut(`/rescuer/reports/${reportId}/status`, { status: newStatus });
                        showAlert('Status updated successfully!', 'success');
                        loadReport(); // reload
                    } catch (error) {
                        showAlert(error.message, 'danger');
                    }
                };

                window.openCompleteModal = () => {
                    document.getElementById('completeModal').style.display = 'flex';
                };

                document.getElementById('complete-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btn-submit-complete');
                    btn.disabled = true;
                    btn.textContent = 'SUBMITTING...';

                    const formData = new FormData();
                    formData.append('notes', document.getElementById('rescue-notes').value);
                    
                    const fileInput = document.getElementById('completion-image');
                    if (fileInput.files[0]) {
                        formData.append('completionImage', fileInput.files[0]);
                    }

                    try {
                        await apiUpload(`/rescuer/reports/${reportId}/complete`, formData);
                        document.getElementById('completeModal').style.display = 'none';
                        showAlert('Rescue completed successfully!', 'success');
                        loadReport();
                    } catch (error) {
                        alert(error.message);
                        btn.disabled = false;
                        btn.textContent = 'SUBMIT COMPLETION';
                    }
                });

                function showAlert(msg, type) {
                    const alertDiv = document.getElementById('alert-msg');
                    alertDiv.textContent = msg;
                    alertDiv.className = `alert alert-${type}`;
                    setTimeout(() => alertDiv.classList.add('hidden'), 3000);
                }
            }
            
            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.querySelector('.sidebar').classList.toggle('active');
            });
        });
    </script>
</body>
</html>
