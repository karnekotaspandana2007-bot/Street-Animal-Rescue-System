<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescuer Dashboard - Smart Street Animal Rescue</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Rescuer Portal</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" class="active">Dashboard</a></li>
                    <li><a href="assigned-reports.html">Assigned Reports</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="btn btn-block btn-outline" style="border-color: rgba(255,255,255,0.3); color: white;">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle">☰</div>
                <div class="user-info">
                    <span id="user-name">Welcome</span>
                    <span class="badge badge-assigned">Rescuer</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-title">
                    <h1>Rescuer Dashboard</h1>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon bg-warning">📋</div>
                        <div class="stat-info">
                            <h3 id="assigned-reports">0</h3>
                            <p>Assigned Reports</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-secondary">🚑</div>
                        <div class="stat-info">
                            <h3 id="active-rescues">0</h3>
                            <p>Active Rescues</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-success">✅</div>
                        <div class="stat-info">
                            <h3 id="completed-rescues">0</h3>
                            <p>Completed Rescues</p>
                        </div>
                    </div>
                </div>

                <h2>Recent Assignments</h2>
                <div class="data-card">
                    <div style="overflow-x: auto;">
                        <table id="recent-assignments-table">
                            <thead>
                                <tr>
                                    <th>Animal</th>
                                    <th>Condition</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="5">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkAuth('rescuer');
            if (user) {
                document.getElementById('user-name').textContent = `Welcome, ${user.name}`;
                
                try {
                    const response = await apiGet('/rescuer/reports');
                    const reports = response.data;
                    
                    document.getElementById('assigned-reports').textContent = reports.length;
                    document.getElementById('active-rescues').textContent = reports.filter(r => ['Assigned', 'Rescue In Progress'].includes(r.status)).length;
                    document.getElementById('completed-rescues').textContent = reports.filter(r => ['Completed', 'Rescued'].includes(r.status)).length;

                    const tbody = document.querySelector('#recent-assignments-table tbody');
                    tbody.innerHTML = '';
                    
                    if (reports.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No reports assigned to you yet.</td></tr>';
                    } else {
                        reports.slice(0, 5).forEach(report => {
                            let badgeClass = 'badge-assigned';
                            if (report.status === 'Rescue In Progress') badgeClass = 'badge-progress';
                            if (report.status === 'Completed' || report.status === 'Rescued') badgeClass = 'badge-completed';
                            
                            tbody.innerHTML += `
                                <tr>
                                    <td>${report.animalType}</td>
                                    <td>${report.condition} (${report.severity})</td>
                                    <td>${report.address}</td>
                                    <td><span class="badge ${badgeClass}">${report.status}</span></td>
                                    <td>
                                        <a href="rescue-details.html?id=${report._id}" class="action-btn btn-view">VIEW</a>
                                    </td>
                                </tr>
                            `;
                        });
                    }
                } catch (error) {
                    console.error('Error fetching reports', error);
                }
            }

            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.querySelector('.sidebar').classList.toggle('active');
            });
        });
    </script>
</body>
</html>
